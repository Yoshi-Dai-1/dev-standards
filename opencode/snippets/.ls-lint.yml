ls:
  src/components:
    .tsx: PascalCase
    .ts: camelCase | PascalCase
    .jsx: PascalCase
    .js: camelCase | PascalCase
  src/utils:
    .ts: camelCase
    .js: camelCase
  src/hooks:
    .ts: camelCase
  src/services:
    .ts: camelCase
  src/types:
    .ts: camelCase
  src/constants:
    .ts: UPPER_SNAKE_CASE
  src/__tests__:
    .test.tsx: PascalCase | camelCase
    .test.ts: camelCase
    .spec.tsx: PascalCase | camelCase
    .spec.ts: camelCase
  src:
    .dir: kebab-case

ignore:
  - node_modules
  - dist
  - build
  - .next
  - coverage
